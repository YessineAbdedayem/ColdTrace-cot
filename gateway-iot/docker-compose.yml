# ColdTrace gateway: everything needed to run and test it on a laptop.
#   site-broker  : Mosquitto on the site, where the ESP32 sensors publish (plain MQTT)
#   cloud-broker : stand-in for the cloud Mosquitto, MQTTS only, login required
#   node-red     : the gateway
#   simulator    : fake sensors and localhost-only fault control API
#   mongo        : local database for the backend
#   dev-seed     : registers the simulated sensors in MongoDB, then exits
#   api          : Jakarta EE backend, built from ../api-rest
#
# Before the first start:  cp .env.example .env   and   ./scripts/gen-certs.sh
# Start:                    docker compose up -d
name: coldtrace-gateway

services:
  site-broker:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/site/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - site-data:/mosquitto/data
    restart: unless-stopped

  cloud-broker:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:8883:8883"
    environment:
      GW_USER: ${CLOUD_GATEWAY_USER}
      GW_PASS: ${CLOUD_GATEWAY_PASSWORD}
      BACKEND_USER: ${CLOUD_BACKEND_USER}
      BACKEND_PASS: ${CLOUD_BACKEND_PASSWORD}
    volumes:
      - ./mosquitto/cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/cloud/acl:/mosquitto/config/acl:ro
      # create_host_path: false makes "up" fail when a certificate is missing,
      # instead of Docker silently creating an empty folder with its name.
      - { type: bind, source: ./certs/ca.crt, target: /mosquitto/certs/ca.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./certs/cloud-broker.crt, target: /mosquitto/certs/cloud-broker.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./certs/cloud-broker.key, target: /mosquitto/certs/cloud-broker.key, read_only: true, bind: { create_host_path: false } }
      - cloud-data:/mosquitto/data
    # Build the password file from .env at each start, then run the broker
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mosquitto_passwd -c -b /mosquitto/passwd "$$GW_USER" "$$GW_PASS"
        mosquitto_passwd -b /mosquitto/passwd "$$BACKEND_USER" "$$BACKEND_PASS"
        chown mosquitto:mosquitto /mosquitto/passwd
        chmod 0700 /mosquitto/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    restart: unless-stopped

  node-red:
    image: nodered/node-red:4.1
    depends_on: [site-broker, cloud-broker]
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      SITE_ID: ${SITE_ID}
      GATEWAY_ID: ${GATEWAY_ID}
      SITE_BROKER_HOST: ${SITE_BROKER_HOST}
      SITE_BROKER_PORT: ${SITE_BROKER_PORT}
      CLOUD_BROKER_HOST: ${CLOUD_BROKER_HOST}
      CLOUD_BROKER_PORT: ${CLOUD_BROKER_PORT}
      CLOUD_GATEWAY_USER: ${CLOUD_GATEWAY_USER}
      CLOUD_GATEWAY_PASSWORD: ${CLOUD_GATEWAY_PASSWORD}
      BUFFER_MAX: ${BUFFER_MAX}
      REPLAY_BATCH: ${REPLAY_BATCH}
    volumes:
      - ./node-red:/data                       # flows.json, settings.js, saved buffer
      # only the CA certificate, never the keys
      - { type: bind, source: ./certs/ca.crt, target: /certs/ca.crt, read_only: true, bind: { create_host_path: false } }
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB: ${MONGO_DB:-coldtrace}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    # While the init script runs, MongoDB listens on loopback only.
    # Pinging the container's own hostname passes once the real server is up.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Dev only: registers the simulated sensors and their profiles, then exits.
  dev-seed:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --quiet
      - mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-coldtrace}?authSource=${MONGO_DB:-coldtrace}
      - --file
      - /seed/seed-dev-sensors.js
    volumes:
      - ./mongo/seed-dev-sensors.js:/seed/seed-dev-sensors.js:ro
      - ./simulator/sensors.json:/seed/sensors.json:ro
    restart: "no"

  api:
    build: ../api-rest
    image: coldtrace-api
    depends_on:
      cloud-broker:
        condition: service_started
      dev-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-coldtrace}?authSource=${MONGO_DB:-coldtrace}
      MQTT_URL: ssl://cloud-broker:8883
      MQTT_USER: ${CLOUD_BACKEND_USER}
      MQTT_PASSWORD: ${CLOUD_BACKEND_PASSWORD}
      MQTT_CA_PATH: /certs/ca.crt
      # Dev only: lets the monitor page (/monitor/) trigger simulator faults through the API
      SIM_CONTROL_URL: http://simulator:${SIM_CONTROL_PORT:-4000}
    volumes:
      - { type: bind, source: ./certs/ca.crt, target: /certs/ca.crt, read_only: true, bind: { create_host_path: false } }
    restart: unless-stopped

  simulator:
    image: node:22-alpine
    depends_on: [site-broker]
    working_dir: /app
    ports:
      - "127.0.0.1:${SIM_CONTROL_PORT:-4000}:${SIM_CONTROL_PORT:-4000}"
    environment:
      BROKER_URL: mqtt://site-broker:1883
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS}
      SIM_BAD_RATE: ${SIM_BAD_RATE}
      SIM_RANDOM_DOOR: ${SIM_RANDOM_DOOR:-false}
      SIM_FAULTS: ${SIM_FAULTS:-}
      SIM_CONTROL_PORT: ${SIM_CONTROL_PORT:-4000}
    volumes:
      - ./simulator:/app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    restart: unless-stopped

volumes:
  site-data:
  cloud-data:
  mongo-data:
