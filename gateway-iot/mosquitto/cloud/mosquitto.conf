# "Cloud" broker: in dev it runs on the laptop, later on the cloud server.
# Only MQTTS (TLS) on port 8883, and a username/password is required.
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/cloud-broker.crt
keyfile  /mosquitto/certs/cloud-broker.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
