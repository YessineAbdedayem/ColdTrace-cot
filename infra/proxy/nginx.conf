# ColdTrace reverse proxy (dev): one entry point on port 80, one name per service.
# The names point to 127.0.0.1 through the hosts file (see infra/proxy/README.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's internal DNS. Resolving at request time lets the proxy start even when a
# service is down, and follows a container after Compose recreates it.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Any other name: refuse, so a typo doesn't silently land on a service.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 404 "Unknown ColdTrace host. Use coldtrace.test or api.coldtrace.test.\n";
}

# Front Office (monitor). Its own Nginx already forwards /api/ and /ws/alerts to the API.
server {
    listen 80;
    server_name coldtrace.test;

    location / {
        set $upstream http://front-office:80;
        proxy_pass $upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# REST API and alert WebSocket.
server {
    listen 80;
    server_name api.coldtrace.test;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# Reserved for later: iam.coldtrace.test (login server), mlflow.coldtrace.test (MLOps).
# Add a server block like the ones above when the service exists.
