# Browser code uses the frontend origin for both REST and WebSocket.
# Docker service names stay here, outside the browser-side JavaScript.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the API container after it is recreated by Compose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://api:8080;
    set $iam http://iam:8080;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login server (middleware/iam): /auth/login and /auth/me, on the same origin as the page (no CORS)
    location /auth/ {
        add_header Cache-Control "no-store" always;
        proxy_pass $iam$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The WebSocket carries the token in ?access_token=: keep it out of the access log.
    location = /ws/alerts {
        access_log off;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
