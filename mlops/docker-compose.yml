# ColdTrace MLOps (dev). Joins the team stack's network, so start gateway-iot first.
#
# Once:      cp .env.example .env   (then change the password)
#            docker compose run --rm ml-user
# Generate:  docker compose run --rm --build generator --days 30 --reset
# Tests:     docker compose run --rm --build --entrypoint pytest generator -q
# Prepare:   docker compose run --rm --build pipeline prepare.py
# Train:     docker compose run --rm pipeline train.py
# All:       docker compose run --rm --build pipeline run.py    (add --generate to rebuild the data)
# MLflow:    docker compose up -d mlflow      then http://mlflow.coldtrace.test (via middleware/proxy)
# Serving:   docker compose up -d --build model-api   then http://api.coldtrace.test/ml/docs
# Monitor:   docker compose up -d --build monitor     then http://localhost:8001/monitoring

name: coldtrace-mlops

services:
  # One-shot: creates the pipeline's MongoDB user with the root account of the dev stack.
  ml-user:
    image: mongo:7
    env_file: ../gateway-iot/.env      # MONGO_ROOT_USER / MONGO_ROOT_PASSWORD
    environment:
      ML_MONGO_USER: ${ML_MONGO_USER}
      ML_MONGO_PASSWORD: ${ML_MONGO_PASSWORD}
      ML_DB: ${ML_DB:-coldtrace_ml}
      SOURCE_DB: ${SOURCE_DB:-coldtrace}
    entrypoint:
      - sh
      - -c
      - mongosh --quiet --host mongo -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --file /scripts/create-ml-user.js
    volumes:
      - ./scripts/create-ml-user.js:/scripts/create-ml-user.js:ro
    networks: [coldtrace]
    profiles: [setup]

  # One-shot: writes synthetic history into the ML database.
  generator:
    build: ./generator
    environment:
      MONGO_URI: mongodb://${ML_MONGO_USER}:${ML_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ML_DB: ${ML_DB:-coldtrace_ml}
      SOURCE_DB: ${SOURCE_DB:-coldtrace}
    volumes:
      - ../gateway-iot/simulator/sensors.json:/data/sensors.json:ro
    networks: [coldtrace]
    profiles: [tools]

  # Training pipeline: run.py runs everything; prepare.py and train.py can also run alone.
  # Writes its files to ./data (ignored by git).
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      MONGO_URI: mongodb://${ML_MONGO_USER}:${ML_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ML_DB: ${ML_DB:-coldtrace_ml}
      SOURCE_DB: ${SOURCE_DB:-coldtrace}
      DATA_DIR: /data
      SENSORS_FILE: /sensors/sensors.json
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/data
      - ../gateway-iot/simulator/sensors.json:/sensors/sensors.json:ro
    networks: [coldtrace]
    profiles: [tools]

  # Experiment tracking and model registry. Runs, metrics and models are kept in the mlflow-data volume.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
    volumes:
      - mlflow-data:/mlflow
    networks: [coldtrace]
    restart: unless-stopped

  # The production model behind an HTTP API. Reloads by itself when @production moves in MLflow.
  model-api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    depends_on: [mlflow]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MONGO_URI: mongodb://${ML_MONGO_USER}:${ML_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      SOURCE_DB: ${SOURCE_DB:-coldtrace}
      ML_DB: ${ML_DB:-coldtrace_ml}      # each live forecast is saved in coldtrace_ml.predictions
    ports:
      - "127.0.0.1:8001:8000"
    networks: [coldtrace]
    restart: unless-stopped

  # Live monitoring: every 5 min, scores the saved forecasts against what really happened, compares the live
  # inputs with the training data (drift), and writes both to coldtrace_ml.monitoring and to MLflow
  # (experiment coldtrace-monitoring). Then retrains if the error or drift persist (retrain.py).
  monitor:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    command: ["monitor.py", "--every", "300"]
    depends_on: [mlflow]
    environment:
      MONGO_URI: mongodb://${ML_MONGO_USER}:${ML_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ML_DB: ${ML_DB:-coldtrace_ml}
      SOURCE_DB: ${SOURCE_DB:-coldtrace}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR: /data
      SENSORS_FILE: /sensors/sensors.json
      # step 9c: retrain on error, drift or age (retrain.py). "false": only log what it would do.
      AUTO_RETRAIN: ${AUTO_RETRAIN:-true}
    volumes:
      # the pipeline's files: the drift fallback reads them, an automatic retraining rewrites them
      - ./data:/data
      - ../gateway-iot/simulator/sensors.json:/sensors/sensors.json:ro
    networks: [coldtrace]
    restart: unless-stopped

volumes:
  mlflow-data:

networks:
  coldtrace:
    external: true
    name: coldtrace-gateway_default
