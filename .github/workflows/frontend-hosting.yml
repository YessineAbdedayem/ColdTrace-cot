name: Frontend WildFly hosting
on:
  push:
    paths: ["frontends/**", "middleware/api/**", "middleware/iam/**", "middleware/proxy/**", "gateway-iot/**", ".github/workflows/frontend-hosting.yml"]
  pull_request:
    paths: ["frontends/**", "middleware/api/**", "middleware/iam/**", "middleware/proxy/**", "gateway-iot/**", ".github/workflows/frontend-hosting.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONT_OFFICE_URL: http://127.0.0.1:13002
      PWA_TEST_USER: operateur
      # Disposable accounts only, never production credentials.
      PWA_TEST_PASSWORD: Integration-only-123!
      HOSTING_MUTATIONS: "1"
      PWA_TEST_ACTIONS: "1"
      HOSTING_CERTS_DIR: ${{ runner.temp }}/coldtrace-hosting/certs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/front-office/package-lock.json
      - name: Unit tests
        run: |
          node --test gateway-iot/simulator/fake-sensors.test.js
          node --test frontends/front-office/tests/sw.test.cjs
      - name: Disposable broker certificates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/coldtrace-hosting/scripts" "$HOSTING_CERTS_DIR"
          cp gateway-iot/scripts/gen-certs.sh "$RUNNER_TEMP/coldtrace-hosting/scripts/"
          bash "$RUNNER_TEMP/coldtrace-hosting/scripts/gen-certs.sh"
      - name: Validate, build Java WARs with tests and start isolated stack
        run: |
          docker compose -f frontends/front-office/tests/hosting.compose.yml config --quiet
          docker compose -f frontends/front-office/tests/hosting.compose.yml --profile proxy up -d --build
      - name: HTTP, IAM, roles, MQTT, controls, acknowledgements and WebSocket
        run: node frontends/front-office/tests/hosting-smoke.cjs
      - name: Reapply CLI and check reload
        run: |
          docker compose -f frontends/front-office/tests/hosting.compose.yml exec -T front-office /opt/jboss/wildfly/bin/jboss-cli.sh --connect --resolve-parameter-values --file=/opt/jboss/frontend-config/default-host.cli --properties=/opt/jboss/frontend-config/frontend.properties
          docker compose -f frontends/front-office/tests/hosting.compose.yml exec -T front-office /opt/jboss/wildfly/bin/jboss-cli.sh --connect --command=:reload
          node frontends/front-office/tests/hosting-smoke.cjs
      - name: Browser and PWA checks
        working-directory: frontends/front-office
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Optional external proxy
        run: |
          node frontends/front-office/tests/proxy-smoke.cjs
          docker compose -f frontends/front-office/tests/hosting.compose.yml logs --no-color proxy > /tmp/coldtrace-proxy.log
          if grep -q access_token /tmp/coldtrace-proxy.log; then echo 'WebSocket token leaked into proxy logs'; exit 1; fi
      - name: Package reviewable deployment artifacts
        run: |
          mkdir -p hosting-artifacts
          tar -czf hosting-artifacts/frontend-static.tar.gz -C frontends/front-office index.html monitor.css monitor.js pwa.js sw.js manifest.webmanifest icons
          tar -czf hosting-artifacts/undertow-config.tar.gz -C frontends/front-office wildfly Dockerfile.wildfly
          docker compose -f frontends/front-office/tests/hosting.compose.yml cp api:/opt/jboss/wildfly/standalone/deployments/ROOT.war hosting-artifacts/coldtrace-api.war
          docker compose -f frontends/front-office/tests/hosting.compose.yml cp iam:/opt/jboss/wildfly/standalone/deployments/ROOT.war hosting-artifacts/coldtrace-iam.war
      - name: Logs
        if: always()
        run: |
          mkdir -p hosting-artifacts
          docker compose -f frontends/front-office/tests/hosting.compose.yml logs --no-color > hosting-artifacts/stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-wildfly-validation
          path: |
            hosting-artifacts/
            frontends/front-office/test-results/
      - name: Stop isolated stack (no persistent volumes)
        if: always()
        run: docker compose -f frontends/front-office/tests/hosting.compose.yml --profile proxy down
