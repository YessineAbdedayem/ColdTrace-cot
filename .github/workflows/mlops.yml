# ColdTrace MLOps pipeline: tests, the whole training pipeline on a small dataset, the model API,
# and the Docker images. Everything runs from scratch with a throwaway MongoDB and MLflow,
# so a green run proves the pipeline works on a clean machine.
name: MLOps pipeline

on:
  push:
    paths:
      - "mlops/**"
      - "gateway-iot/simulator/sensors.json"
      - ".github/workflows/mlops.yml"
  pull_request:
    paths:
      - "mlops/**"
      - "gateway-iot/simulator/sensors.json"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/*/requirements.txt
      - name: Install
        run: pip install -r mlops/pipeline/requirements.txt -r mlops/serving/requirements.txt
      - name: Generator tests
        working-directory: mlops/generator
        run: pytest -q
      - name: Pipeline tests
        working-directory: mlops/pipeline
        run: pytest -q
      - name: Serving tests
        working-directory: mlops/serving
        run: PYTHONPATH=../pipeline pytest -q

  pipeline:
    name: Train, register, serve (3 days of data)
    needs: tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017
      ML_DB: coldtrace_ml
      SOURCE_DB: coldtrace
      DATA_DIR: ${{ github.workspace }}/ci-data
      SENSORS_FILE: ${{ github.workspace }}/gateway-iot/simulator/sensors.json
      MLFLOW_TRACKING_URI: http://localhost:5000
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mlops/*/requirements.txt
      - name: Install
        run: pip install -r mlops/pipeline/requirements.txt -r mlops/serving/requirements.txt
      - name: Start MLflow
        run: |
          docker run -d --name mlflow -p 5000:5000 ghcr.io/mlflow/mlflow:v2.18.0 \
            mlflow server --host 0.0.0.0 --port 5000 \
            --backend-store-uri sqlite:////tmp/mlflow.db --artifacts-destination /tmp/artifacts --serve-artifacts
          for i in $(seq 60); do curl -sf http://localhost:5000/health && exit 0; sleep 2; done
          docker logs mlflow; exit 1
      - name: Run the pipeline (generate, prepare, train, register, check)
        working-directory: mlops/pipeline
        run: python run.py --generate --days 3 --end 2026-11-01T00:00:00 --test-days 1 --val-days 0.5
      - name: Start the model API and check its predictions
        working-directory: mlops/serving
        run: |
          PYTHONPATH=../pipeline uvicorn app:app --port 8000 > /tmp/model-api.log 2>&1 &
          python ../ci/smoke_serving.py http://localhost:8000 || (cat /tmp/model-api.log; exit 1)
      - name: Keep the metrics and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-report
          path: |
            ci-data/metrics.json
            ci-data/prepare.json
            ci-data/report/
          if-no-files-found: ignore

  images:
    name: Docker images
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t coldtrace-generator mlops/generator
          docker build -t coldtrace-pipeline -f mlops/pipeline/Dockerfile mlops
          docker build -t coldtrace-model-api -f mlops/serving/Dockerfile mlops
