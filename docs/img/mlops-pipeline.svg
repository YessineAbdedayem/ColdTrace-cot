<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5361"/>
    </marker>
  </defs>
  <rect width="1240" height="890" fill="#ffffff"/>

  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2430">ColdTrace MLOps pipeline</text>

  <!-- 1 DATA -->
  <rect x="20" y="56" width="1200" height="190" rx="10" fill="#eef5fc" stroke="#9cc3e6"/>
  <text x="36" y="80" font-size="13" font-weight="700" fill="#2c6aa8" letter-spacing="1">1 · DATA</text>

  <rect x="50" y="98" width="270" height="124" rx="8" fill="#fff" stroke="#3b7dc4" stroke-width="1.5"/>
  <text x="185" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Synthetic data generator</text>
  <text x="185" y="148" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">generator/generate.py</text>
  <text x="185" y="172" text-anchor="middle" font-size="13" fill="#1d2430">30 days · 10 sensors · every 5 s</text>
  <text x="185" y="194" text-anchor="middle" font-size="13" fill="#1d2430">faults injected and logged</text>

  <line x1="320" y1="160" x2="376" y2="160" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="380" y="98" width="300" height="124" rx="8" fill="#fff" stroke="#3b7dc4" stroke-width="1.5"/>
  <text x="530" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">MongoDB · coldtrace_ml</text>
  <text x="530" y="150" text-anchor="middle" font-size="13" fill="#1d2430">measurements: 5.1 M readings</text>
  <text x="530" y="172" text-anchor="middle" font-size="13" fill="#1d2430">fault_log: 750 labelled faults</text>
  <text x="530" y="194" text-anchor="middle" font-size="13" fill="#1d2430">rule_incidents: what the rule opens</text>

  <rect x="760" y="98" width="200" height="124" rx="8" fill="#fff" stroke="#3b7dc4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="860" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Live platform</text>
  <text x="860" y="150" text-anchor="middle" font-size="13" fill="#1d2430">simulator (ESP32 later)</text>
  <text x="860" y="172" text-anchor="middle" font-size="13" fill="#1d2430">→ gateway → MQTTS</text>
  <text x="860" y="194" text-anchor="middle" font-size="13" fill="#1d2430">→ Java API</text>

  <line x1="960" y1="160" x2="996" y2="160" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="1000" y="98" width="200" height="124" rx="8" fill="#fff" stroke="#3b7dc4" stroke-width="1.5"/>
  <text x="1100" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">MongoDB · coldtrace</text>
  <text x="1100" y="150" text-anchor="middle" font-size="13" fill="#1d2430">live readings</text>
  <text x="1100" y="172" text-anchor="middle" font-size="13" fill="#1d2430">sensors, thresholds</text>
  <text x="1100" y="194" text-anchor="middle" font-size="13" fill="#4a5361">read-only for ML</text>

  <!-- 2 TRAINING -->
  <rect x="20" y="266" width="1200" height="200" rx="10" fill="#fff5ea" stroke="#f0b878"/>
  <text x="36" y="290" font-size="13" font-weight="700" fill="#b8650f" letter-spacing="1">2 · TRAINING PIPELINE — one command: pipeline/run.py</text>

  <path d="M530 222 V250 H175 V306" fill="none" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="50" y="310" width="250" height="134" rx="8" fill="#fff" stroke="#d9822b" stroke-width="1.5"/>
  <text x="175" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Prepare</text>
  <text x="175" y="357" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">prepare.py · features.py</text>
  <text x="175" y="380" text-anchor="middle" font-size="13" fill="#1d2430">1 row per sensor per minute</text>
  <text x="175" y="400" text-anchor="middle" font-size="13" fill="#1d2430">16 features (past only)</text>
  <text x="175" y="420" text-anchor="middle" font-size="13" fill="#1d2430">target: max temp, next 10 min</text>
  <text x="175" y="438" text-anchor="middle" font-size="12" fill="#4a5361">time split: last 8 days = test</text>

  <line x1="300" y1="377" x2="341" y2="377" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="345" y="310" width="250" height="134" rx="8" fill="#fff" stroke="#d9822b" stroke-width="1.5"/>
  <text x="470" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Train</text>
  <text x="470" y="357" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">train.py</text>
  <text x="470" y="380" text-anchor="middle" font-size="13" fill="#1d2430">LightGBM regression</text>
  <text x="470" y="400" text-anchor="middle" font-size="13" fill="#1d2430">early stopping on validation</text>
  <text x="470" y="420" text-anchor="middle" font-size="13" fill="#1d2430">warning margin chosen</text>
  <text x="470" y="438" text-anchor="middle" font-size="12" fill="#4a5361">on validation days only</text>

  <line x1="595" y1="377" x2="636" y2="377" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="640" y="310" width="250" height="134" rx="8" fill="#fff" stroke="#d9822b" stroke-width="1.5"/>
  <text x="765" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Evaluate</text>
  <text x="765" y="357" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">evaluate.py</text>
  <text x="765" y="380" text-anchor="middle" font-size="13" fill="#1d2430">vs current rule + 2 baselines</text>
  <text x="765" y="400" text-anchor="middle" font-size="13" fill="#1d2430">detection, lead time,</text>
  <text x="765" y="420" text-anchor="middle" font-size="13" fill="#1d2430">false alarms per day</text>
  <text x="765" y="438" text-anchor="middle" font-size="12" fill="#4a5361">charts + learning curve</text>

  <line x1="890" y1="377" x2="931" y2="377" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="935" y="310" width="250" height="134" rx="8" fill="#fff" stroke="#d9822b" stroke-width="1.5"/>
  <text x="1060" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Track and register</text>
  <text x="1060" y="357" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">tracking.py</text>
  <text x="1060" y="380" text-anchor="middle" font-size="13" fill="#1d2430">log params, metrics, charts</text>
  <text x="1060" y="400" text-anchor="middle" font-size="13" fill="#1d2430">and the model to MLflow</text>
  <text x="1060" y="420" text-anchor="middle" font-size="13" fill="#1d2430">register a new version</text>
  <text x="1060" y="438" text-anchor="middle" font-size="12" fill="#4a5361">then: check it loads and predicts</text>

  <!-- 3 REGISTRY & SERVING -->
  <rect x="20" y="486" width="1200" height="244" rx="10" fill="#f4f0fb" stroke="#b9a5e0"/>
  <text x="36" y="510" font-size="13" font-weight="700" fill="#6a4bb0" letter-spacing="1">3 · REGISTRY AND SERVING</text>

  <line x1="1060" y1="444" x2="1060" y2="526" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="935" y="530" width="250" height="150" rx="8" fill="#fff" stroke="#7d5cc4" stroke-width="1.5"/>
  <text x="1060" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">MLflow</text>
  <text x="1060" y="577" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">mlflow.coldtrace.test</text>
  <text x="1060" y="600" text-anchor="middle" font-size="13" fill="#1d2430">every run: params, metrics,</text>
  <text x="1060" y="620" text-anchor="middle" font-size="13" fill="#1d2430">learning curve, charts</text>
  <text x="1060" y="640" text-anchor="middle" font-size="13" fill="#1d2430">model registry:</text>
  <text x="1060" y="660" text-anchor="middle" font-size="13" fill="#1d2430">versions 1, 2, 3, …</text>

  <line x1="935" y1="605" x2="839" y2="605" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polygon points="760,540 835,605 760,670 685,605" fill="#fff" stroke="#7d5cc4" stroke-width="1.5"/>
  <text x="760" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">better than</text>
  <text x="760" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">production?</text>
  <text x="760" y="694" text-anchor="middle" font-size="12" fill="#4a5361">no → stays a version,</text>
  <text x="760" y="710" text-anchor="middle" font-size="12" fill="#4a5361">production unchanged</text>

  <line x1="685" y1="605" x2="634" y2="605" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="660" y="596" text-anchor="middle" font-size="12" font-weight="700" fill="#2e8b57">yes</text>

  <rect x="430" y="560" width="200" height="90" rx="8" fill="#fff" stroke="#7d5cc4" stroke-width="1.5"/>
  <text x="530" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">@production</text>
  <text x="530" y="610" text-anchor="middle" font-size="13" fill="#1d2430">alias moves to</text>
  <text x="530" y="630" text-anchor="middle" font-size="13" fill="#1d2430">the new version</text>
  <text x="530" y="676" text-anchor="middle" font-size="12" fill="#4a5361">rule: detects as much, no more</text>
  <text x="530" y="692" text-anchor="middle" font-size="12" fill="#4a5361">false alarms, warns earlier</text>

  <line x1="430" y1="605" x2="384" y2="605" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="407" y="596" text-anchor="middle" font-size="12" fill="#4a5361">loads</text>

  <rect x="50" y="530" width="330" height="160" rx="8" fill="#fff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="215" y="556" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2430">Model API</text>
  <text x="215" y="577" text-anchor="middle" font-size="13" fill="#4a5361" font-family="Consolas, monospace">serving/ · api.coldtrace.test/ml</text>
  <text x="215" y="600" text-anchor="middle" font-size="13" fill="#1d2430">loads @production by name,</text>
  <text x="215" y="620" text-anchor="middle" font-size="13" fill="#1d2430">reloads it every 60 s (no restart)</text>
  <text x="215" y="642" text-anchor="middle" font-size="13" fill="#1d2430" font-family="Consolas, monospace">GET /forecast/{sensor}</text>
  <text x="215" y="660" text-anchor="middle" font-size="13" fill="#1d2430" font-family="Consolas, monospace">POST /predict · GET /health</text>
  <text x="215" y="681" text-anchor="middle" font-size="12" fill="#4a5361">→ warning before the limit is crossed</text>

  <path d="M1200 160 H1228 V716 H215 V694" fill="none" stroke="#2e8b57" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="640" y="726" text-anchor="middle" font-size="12" fill="#2e8b57">live readings of the last 20 minutes</text>

  <!-- 4 CI -->
  <rect x="20" y="750" width="1200" height="122" rx="10" fill="#f2f4f6" stroke="#b8bec6"/>
  <text x="36" y="774" font-size="13" font-weight="700" fill="#4a5361" letter-spacing="1">4 · CI — GitHub Actions, on every push to mlops/</text>

  <rect x="50" y="792" width="250" height="62" rx="8" fill="#fff" stroke="#6b7480" stroke-width="1.5"/>
  <text x="175" y="818" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2430">Unit tests</text>
  <text x="175" y="839" text-anchor="middle" font-size="13" fill="#1d2430">23 tests</text>

  <line x1="300" y1="823" x2="341" y2="823" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="345" y="792" width="250" height="62" rx="8" fill="#fff" stroke="#6b7480" stroke-width="1.5"/>
  <text x="470" y="818" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2430">Whole pipeline from scratch</text>
  <text x="470" y="839" text-anchor="middle" font-size="13" fill="#1d2430">fresh MongoDB + MLflow, 3 days</text>

  <line x1="595" y1="823" x2="636" y2="823" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="640" y="792" width="250" height="62" rx="8" fill="#fff" stroke="#6b7480" stroke-width="1.5"/>
  <text x="765" y="818" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2430">Model API smoke test</text>
  <text x="765" y="839" text-anchor="middle" font-size="13" fill="#1d2430">warns only for a failing fridge</text>

  <line x1="890" y1="823" x2="931" y2="823" stroke="#4a5361" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="935" y="792" width="250" height="62" rx="8" fill="#fff" stroke="#6b7480" stroke-width="1.5"/>
  <text x="1060" y="818" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2430">Docker images</text>
  <text x="1060" y="839" text-anchor="middle" font-size="13" fill="#1d2430">generator, pipeline, model API</text>
</svg>
