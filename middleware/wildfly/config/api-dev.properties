# add-api.cli, development: the REST API and the alert WebSocket, deployed as api-1.0.war.
# One alias only (the course script takes a single name). The other containers reach it with the same name:
# Docker resolves api.coldtrace.test to the WildFly container (network alias), on the internal port 8080.
api.name=api
api.version=1.0
api.aliases=api.coldtrace.test
api.context=coldtrace
api.domains=coldtrace.test
