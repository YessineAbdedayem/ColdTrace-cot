# ColdTrace reverse proxy (dev): one entry point on port 80, one name per service.
# The names point to 127.0.0.1 through the hosts file (see middleware/proxy/README.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# access_token is in the WebSocket query: do not log that request at this hop.
map $uri $coldtrace_loggable {
    default 1;
    /ws/alerts 0;
}

# Docker's internal DNS. Resolving at request time lets the proxy start even when a
# service is down, and follows a container after Compose recreates it.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Any other name: refuse, so a typo doesn't silently land on a service.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log combined if=$coldtrace_loggable;
    default_type text/plain;
    return 404 "Unknown ColdTrace host. Use coldtrace.test, api.coldtrace.test, iam.coldtrace.test or mlflow.coldtrace.test.\n";
}

# Front Office: WildFly/Undertow serves assets and forwards API/auth/WebSocket.
server {
    listen 80;
    server_name coldtrace.test;
    access_log /var/log/nginx/access.log combined if=$coldtrace_loggable;

    location / {
        set $upstream http://front-office:80;
        proxy_pass $upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# REST API and alert WebSocket.
server {
    listen 80;
    server_name api.coldtrace.test;
    access_log /var/log/nginx/access.log combined if=$coldtrace_loggable;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Early-warning model (mlops/serving): /ml/health, /ml/predict, /ml/forecast/{sensorId}, /ml/docs
    location /ml/ {
        set $upstream http://model-api:8000;   # before the rewrite: "break" ends the rewrite phase
        rewrite ^/ml/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
}

# MLflow (mlops/docker-compose.yml): experiment tracking and model registry.
server {
    listen 80;
    server_name mlflow.coldtrace.test;
    access_log /var/log/nginx/access.log combined if=$coldtrace_loggable;
    client_max_body_size 200m;   # model and chart uploads from the browser

    location / {
        set $upstream http://mlflow:5000;
        proxy_pass $upstream;
    }
}

# Login server (middleware/iam): /auth/login, /auth/me, /auth/public-key, /users (admin).
server {
    listen 80;
    server_name iam.coldtrace.test;
    access_log /var/log/nginx/access.log combined if=$coldtrace_loggable;

    location / {
        set $upstream http://iam:8080;
        proxy_pass $upstream;
    }
}
