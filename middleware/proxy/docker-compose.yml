# ColdTrace reverse proxy (dev), on WildFly/Undertow.
# Start the team stack first (gateway-iot), then from this folder:  docker compose up -d --build
# It joins the stack's network and reaches the services by their Compose names.

name: coldtrace-proxy

services:
  proxy:
    build: .
    image: coldtrace-proxy-wildfly
    ports:
      - "127.0.0.1:80:8080"
    networks: [coldtrace]
    restart: unless-stopped

networks:
  coldtrace:
    external: true
    name: coldtrace-gateway_default
